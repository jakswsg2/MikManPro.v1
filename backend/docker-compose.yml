# Production Multi-Service Docker Compose for Smart Lounge
services:
  postgres:
    image: postgres:16-alpine
    container_name: smart_lounge_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smart_lounge_db}
      POSTGRES_USER: ${POSTGRES_USER:-lounge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lounge_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lounge_user} -d ${POSTGRES_DB:-smart_lounge_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart_lounge_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_lounge_backend
    restart: always
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn smart_lounge.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-django-insecure-smart-lounge-lan-secret-key}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lounge_user}:${POSTGRES_PASSWORD:-lounge_secret_2026}@postgres:5432/${POSTGRES_DB:-smart_lounge_db}
      - REDIS_URL=redis://redis:6379/0
      - ALLOWED_HOSTS=*
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_lounge_celery_worker
    restart: always
    command: celery -A smart_lounge worker -l info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lounge_user}:${POSTGRES_PASSWORD:-lounge_secret_2026}@postgres:5432/${POSTGRES_DB:-smart_lounge_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_lounge_celery_beat
    restart: always
    command: celery -A smart_lounge beat -l info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-lounge_user}:${POSTGRES_PASSWORD:-lounge_secret_2026}@postgres:5432/${POSTGRES_DB:-smart_lounge_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
