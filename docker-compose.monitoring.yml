version: '3.9'

services:
  prometheus:
    build:
      context: ./docker/monitoring/prometheus
    image: smart-lounge/prometheus:latest
    container_name: lounge_prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - lounge-monitoring
      - lounge-backend
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    build:
      context: ./docker/monitoring/grafana
    image: smart-lounge/grafana:latest
    container_name: lounge_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - lounge-monitoring
    ports:
      - "127.0.0.1:3000:3000"

  loki:
    build:
      context: ./docker/monitoring/loki
    image: smart-lounge/loki:latest
    container_name: lounge_loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - loki_data:/loki
      - ./docker/monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
    networks:
      - lounge-monitoring
    ports:
      - "127.0.0.1:3100:3100"

  node-exporter:
    image: prom/node-exporter:latest
    container_name: lounge_node_exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - lounge-monitoring

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: lounge_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
    networks:
      - lounge-monitoring
      - lounge-backend

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: lounge_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - lounge-monitoring
      - lounge-backend

  flower:
    build:
      context: ./smart_lounge
      dockerfile: ../docker/backend/Dockerfile
    image: smart-lounge/backend:${IMAGE_TAG:-latest}
    container_name: lounge_flower
    restart: unless-stopped
    command: >
      celery -A config flower
        --port=5555
        --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD}
    environment:
      TZ: Asia/Aden
      PYTHONUNBUFFERED: "1"
      DJANGO_SETTINGS_MODULE: config.settings.production
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    networks:
      - lounge-monitoring
      - lounge-backend
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5555:5555"
